      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Es un ritual dúo en el que dos personas reciben un masaje relajante a la vez, en la misma cabina, con aromaterapia y un ambiente cálido pensado para compartir un momento de calma."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuánto dura la micropigmentación de cejas, labios u ojos?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El resultado se mantiene de forma natural entre 12 y 24 meses, según tu tipo de piel, el cuidado diario y la exposición solar. Incluimos una sesión de retoque de asentamiento para consolidar un acabado impecable."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cómo es el proceso de cicatrización?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "La primera semana el color se ve más intenso por la oxidación natural; en la segunda se forma una microcostra que se desprende sola; hacia la tercera la piel se renueva y el pigmento vuelve a la superficie; en la cuarta realizamos el retoque final."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué medidas de higiene y seguridad seguís?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Trabajamos con asepsia de grado clínico conforme al Decreto 5/2004 de la JCCM, pigmentos registrados en la AEMPS, agujas monodosis de un solo uso y certificación sanitaria oficial."
      }
    },
    {
      "@type": "Question",
      "name": "¿En qué consisten las uñas de autor y cuánto duran?",

        "@type": "Answer",

      }

  .scroll-progress {
    position: fixed; top: 0; left: 0; height: 2px; width: 0%;
    background: var(--ink); z-index: 100; transition: width .05s linear;
  }

  /* ---------- Reveal primitives ---------- */
  .r-fade { opacity: 0; transform: translateY(32px); transition: opacity 1.1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .r-fade.in { opacity: 1; transform: translateY(0); }
  .r-left { opacity: 0; transform: translateX(-40px); transition: opacity 1.1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .r-left.in { opacity: 1; transform: translateX(0); }
  .r-right { opacity: 0; transform: translateX(40px); transition: opacity 1.1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .r-right.in { opacity: 1; transform: translateX(0); }

  /* Mask reveal — clip-path */
  .r-mask { clip-path: inset(0 0 100% 0); transition: clip-path 1.4s cubic-bezier(.65,.05,.36,1); }
  .r-mask.in { clip-path: inset(0 0 0% 0); }
  .r-mask-h { clip-path: inset(0 100% 0 0); transition: clip-path 1.4s cubic-bezier(.65,.05,.36,1); }
  .r-mask-h.in { clip-path: inset(0 0% 0 0); }

  /* word reveal */
  .r-word { display: inline-block; opacity: 0; transform: translateY(60%); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .r-word.in { opacity: 1; transform: translateY(0); }

  /* line reveal — wraps text in overflow-hidden, animates Y */
  .line-mask { display: block; overflow: hidden; }
  .line-mask > span { display: inline-block; transform: translateY(110%); transition: transform 1.1s cubic-bezier(.7,0,.2,1); }
  .line-mask.in > span { transform: translateY(0); }

  /* image parallax wrapper */
  [data-parallax] { will-change: transform; }

  /* Reliable cover image used in hero, interludes, nails, facial, track */
  .cover-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
    -webkit-user-drag: none; user-select: none;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    column-gap: 56px;
    padding: 16px 56px;
    background: #0e0d0c;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 6px 32px -8px rgba(0,0,0,.45);
    transform: translateY(-110%);
    opacity: 0;
    pointer-events: none;
    transition:
      transform 1.1s cubic-bezier(.22,.61,.36,1),
      opacity .8s ease,
      padding .35s ease,
      box-shadow .5s ease;
  }
  .nav.visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .nav.scrolled {
    padding: 12px 56px;
    box-shadow: 0 10px 40px -8px rgba(0,0,0,.55);
  }
  .nav-links {
    display: flex; gap: 44px; align-items: center; justify-content: center;
    font-family: var(--sans); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; font-weight: 500;
  }
  .nav-cta { justify-self: end; display: flex; align-items: center; gap: 18px; }
  .brand-mark { display: inline-flex; align-items: center; gap: 14px; line-height: 1; }
  .brand-mark .logo-img {
    height: 46px; width: auto; display: block;
    transition: height .35s ease;
  }
  /* El logo es un PNG cuadrado con fondo sólido; el blend elimina el recuadro
     y deja sólo la firma, integrada con el color de la barra/menú. */
  img.on-dark { mix-blend-mode: lighten; }
  img.on-light { mix-blend-mode: multiply; }
  .nav.scrolled .brand-mark .logo-img { height: 40px; }
  .brand-mark .logo-light { display: block; }
  .brand-mark .logo-dark { display: none; }
  .nav-links {
    display: flex; gap: 36px; align-items: center; justify-content: center;
    font-family: var(--sans); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; font-weight: 500;
  }
  .nav-links a { color: rgba(255,255,255,0.82); position: relative; padding: 6px 0; }
  .nav-links a::after { content:""; position:absolute; left:0; bottom: 0; width: 0; height: 1px; background: #fff; transition: width .4s ease; }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta { justify-self: end; display: flex; align-items: center; gap: 12px; }

  /* ---------- Nav dropdowns ---------- */
  .nav-dd { position: relative; }
  .nav-dd-btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-style: normal; font-weight: 500;
    font-size: 11px; letter-spacing: .26em; text-transform: uppercase;
    padding: 12px 22px;
    border: 1px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.88); background: transparent;
    border-radius: 999px;
    transition: background .4s ease, color .4s ease, border-color .4s ease;
    cursor: pointer; line-height: 1; white-space: nowrap;
  }
  .nav-dd-btn .chev {
    width: 6px; height: 6px; border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor;
    transform: rotate(45deg) translate(-1px, -1px); transition: transform .4s ease;
    margin-left: 2px;
  }
  .nav-dd.open .nav-dd-btn .chev { transform: rotate(-135deg) translate(-2px, -2px); }
  .nav-dd-btn:hover { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.6); }
  .nav-dd-btn.dark { background: #fff; color: #0e0d0c; border-color: #fff; }
  .nav-dd-btn.dark:hover { background: rgba(255,255,255,0.88); color: #0e0d0c; }
  .nav-dd-btn .lead-ic {
    width: 14px; height: 14px; display: inline-grid; place-items: center;
  }
  .nav-dd-btn .lead-ic svg { width: 14px; height: 14px; }

  .nav-dd-panel {
    position: absolute; top: calc(100% + 14px); right: 0; min-width: 280px;
    background: var(--card-bg); border: 1px solid var(--hair);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.18), 0 8px 24px -8px rgba(0,0,0,.1);
    padding: 10px;
    opacity: 0; transform: translateY(-8px) scale(.97);
    transform-origin: top right; pointer-events: none;
    transition: opacity .35s ease, transform .45s cubic-bezier(.22,.61,.36,1);
  }
  .nav-dd.open .nav-dd-panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .nav-dd-panel .item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; color: var(--ink);
    transition: background .25s ease, padding .35s ease;
    border-radius: 0;
  }
  .nav-dd-panel .item + .item { border-top: 1px solid var(--hair); }
  .nav-dd-panel .item:hover { background: var(--bg-soft); padding-left: 22px; }
  .nav-dd-panel .item .ic {
    width: 36px; height: 36px; display: grid; place-items: center;
    border: 1px solid var(--hair); border-radius: 50%;
  }
  .nav-dd-panel .item .ic svg { width: 14px; height: 14px; }
  .nav-dd-panel .item .meta { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .nav-dd-panel .item .t {
    font-family: var(--serif); font-style: italic; font-size: 18px; font-weight: 500; color: var(--ink);
  }
  .nav-dd-panel .item .h {
    font-family: var(--sans); font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted);
  }
  .nav-dd-panel .item .arrow {
    color: var(--muted); transition: transform .3s ease, color .3s ease;
  }
  .nav-dd-panel .item:hover .arrow { transform: translateX(4px); color: var(--ink); }

  /* compact variant for socials */
  .nav-dd-panel.socials .item { padding: 10px 14px; }
  .nav-dd-panel.socials .item .ic { width: 32px; height: 32px; }

  /* Hamburger button (mobile + always-visible on hero) */
  .nav-menu-btn {
    display: none;
    width: 44px; height: 44px; place-items: center; cursor: pointer;
    background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
    border: 1px solid var(--hair); border-radius: 999px;
  }
  .nav-menu-btn .lines { width: 16px; height: 10px; position: relative; }
  .nav-menu-btn .lines::before, .nav-menu-btn .lines::after {
    content: ""; position: absolute; left: 0; right: 0; height: 1px; background: var(--ink);
    transition: transform .35s ease, top .35s ease;
  }
  .nav-menu-btn .lines::before { top: 2px; }
  .nav-menu-btn .lines::after { top: 8px; }
  .nav-menu-btn.open .lines::before { top: 5px; transform: rotate(45deg); }
  .nav-menu-btn.open .lines::after { top: 5px; transform: rotate(-45deg); }

  /* Floating hamburger on hero (always visible) */
  .float-menu {
    position: fixed; top: 22px; right: 28px; z-index: 70;
    display: none; place-items: center;
    transition: opacity .5s ease, transform .5s ease;
  }
  .float-menu.hide { opacity: 0; transform: translateY(-10px); pointer-events: none; }

  /* Drawer overlay */
  .drawer-overlay {
    position: fixed; inset: 0; z-index: 80; pointer-events: none;
    overflow: hidden; /* clip the off-canvas drawer to avoid phantom horizontal scroll */
    contain: layout paint;
  }
  .drawer-overlay .scrim {
    position: absolute; inset: 0; background: rgba(10,10,10,0.0);
    transition: background .6s ease;
  }
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 88vw);
    background: #fff; padding: 28px 40px 40px;
    transform: translateX(100%); transition: transform .7s cubic-bezier(.65,.05,.36,1);
    display: flex; flex-direction: column; gap: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .drawer-overlay.open { pointer-events: auto; }
  .drawer-overlay.open .scrim { background: rgba(10,10,10,0.5); }
  .drawer-overlay.open .drawer { transform: translateX(0); }
  .drawer-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 28px; border-bottom: 1px solid var(--hair); margin-bottom: 28px; }
  .drawer-top .brand-mark { font-size: 18px; }
  .drawer-close {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair);
    display: grid; place-items: center; position: relative;
  }
  .drawer-close::before, .drawer-close::after {
    content: ""; position: absolute; width: 14px; height: 1px; background: var(--ink);
  }
  .drawer-close::before { transform: rotate(45deg); }
  .drawer-close::after { transform: rotate(-45deg); }
  .drawer-links { display: flex; flex-direction: column; gap: 0; flex: 1; }
  .drawer-links a {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(34px, 5vw, 56px); line-height: 1.2; letter-spacing: -.01em;
    color: var(--ink); padding: 14px 0; border-bottom: 1px solid var(--hair);
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    transition: color .3s ease, padding .3s ease;
  }
  .drawer-links a .idx { font-family: var(--sans); font-style: normal; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .drawer-links a:hover { color: var(--muted); padding-left: 12px; }
  .drawer-foot { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
  .drawer-foot .label { font-family: var(--sans); font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .drawer-foot .addr { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.4; }
  .drawer-foot .row { display: flex; gap: 18px; align-items: center; }
  .drawer-foot .row a { color: var(--ink); opacity: .7; }
  .drawer-foot .row a:hover { opacity: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--sans); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500;
    padding: 14px 22px;
    border: 1px solid var(--ink);
    color: var(--ink); background: transparent;
    border-radius: 999px;
    transition: background .35s ease, color .35s ease, border-color .35s ease;
  }
  .btn:hover { background: var(--ink); color: var(--bg); }
  .btn.rose { border-color: var(--rose); }
  .btn.rose:hover { background: var(--rose); color: var(--ink); border-color: var(--rose); }
  .btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.dark:hover { background: transparent; color: var(--ink); }
  .btn .arrow { display: inline-block; transition: transform .35s ease; }
  .btn:hover .arrow { transform: translateX(4px); }
  .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }

  /* ---------- Typography ---------- */
  .kicker {
    font-family: var(--sans); font-size: 10.5px; letter-spacing: .42em; text-transform: uppercase; font-weight: 500;
    color: var(--muted);
  }
  .display {
    font-family: var(--serif); font-weight: 300; font-style: italic;
    font-size: clamp(64px, 11vw, 180px);
    line-height: .92; letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .h-section {
    font-family: var(--serif); font-weight: 400; font-style: italic;
    font-size: clamp(44px, 7vw, 104px);
    line-height: 1.0; letter-spacing: -0.008em;
    text-wrap: balance;
  }
  .h-sub {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(26px, 3vw, 38px); line-height: 1.2;
  }
  .lead {
    font-family: var(--sans); font-weight: 300; font-size: 18px; line-height: 1.7; color: var(--ink-2);
    max-width: 54ch; text-wrap: pretty;
  }
  .body { font-size: 16px; line-height: 1.75; color: var(--ink-2); font-weight: 300; max-width: 54ch; }
  .small-caps { font-family: var(--sans); font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; font-weight: 500; color: var(--muted); }

  /* ---------- Layout ---------- */
  section { padding: 110px 48px; position: relative; }
  .container { max-width: 1320px; margin: 0 auto; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }
  .grid-2.end { align-items: end; }

  /* chapter mark */
  .chapter {
    display: flex; align-items: baseline; gap: 18px; margin-bottom: 44px;
  }
  .chapter .num {
    font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 22px; color: var(--ink);
  }
  .chapter .rule { flex: 0 0 56px; height: 1px; background: var(--ink); }
  .chapter .small-caps { color: var(--ink); }
  .chapter .percent { color: var(--muted); margin-left: auto; }

  /* big floating chapter number */
  .ghost-num {
    position: absolute; font-family: var(--display); font-weight: 400;
    font-size: clamp(180px, 28vw, 460px); line-height: .8;
    color: rgba(10,10,10,0.035); pointer-events: none; user-select: none;
    top: 60px; right: -30px; z-index: 0;
    will-change: transform;
  }

  /* ---------- HERO ---------- */
  .hero { padding: 0; min-height: 100vh; min-height: 100svh; position: relative; overflow: hidden; }
  .hero-inner {
    min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: 1.1fr 1fr; gap: 0;
    align-items: stretch;
  }
  .hero-text {
    padding: 160px 64px 90px 80px; display: flex; flex-direction: column; justify-content: center; gap: 32px;
    position: relative; z-index: 2;
  }
  .hero-photo {
    position: relative; overflow: hidden; background: var(--bg-soft);
  }
  .hero-photo .inner { position: absolute; inset: -8% 0; }
  .hero-meta {
    position: absolute; left: 80px; bottom: 40px; right: 80px;
    display: flex; justify-content: space-between; align-items: end; gap: 32px;
    font-family: var(--sans); font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
  }
  .hero-meta .num { font-family: var(--serif); font-style: italic; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .scroll-cue {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    font-family: var(--sans); font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
  }
  .scroll-cue .bar {
    width: 1px; height: 56px; background: linear-gradient(to bottom, transparent, var(--ink)); position: relative; overflow: hidden;
  }
  .scroll-cue .bar::after {
    content: ""; position: absolute; top: -56px; left: 0; right: 0; height: 56px;
    background: linear-gradient(to bottom, transparent, var(--bg)); animation: cue 2.4s ease-in-out infinite;
  }
  @keyframes cue { 0% { top: -56px; } 100% { top: 100%; } }

  /* ---------- Interlude full-bleed bands ---------- */
  .interlude {
    position: relative; height: 75vh; min-height: 520px; overflow: hidden;
    background: var(--bg-soft);
  }
  .interlude .photo {
    position: absolute; inset: -15% 0; will-change: transform;
  }
  .interlude::after {
    content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.30) 100%);
    pointer-events: none;
  }
  .interlude .legend {
    position: absolute; left: 48px; right: 48px; bottom: 40px; display: flex; justify-content: space-between; align-items: end; color: #fff;
    font-family: var(--sans); font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    z-index: 2;
  }
  .interlude .legend .ital {
    font-family: var(--serif); font-style: italic; font-size: clamp(28px, 4vw, 56px); letter-spacing: -.01em; text-transform: none; line-height: 1; max-width: 18ch;
  }

  /* ---------- Section: Micropigmentación ---------- */
  .sec-micro {
    background: linear-gradient(180deg, #ffffff 0%, var(--bg-soft) 60%, var(--bg-soft) 100%);
  }
  .sec-micro-secondary {
    padding: 90px 48px;
  }
  .sec-micro-secondary .methods-list.compact {
    margin-top: 56px;
  }
  .sec-micro-secondary .methods-list.compact .row {
    padding: 28px 0;
  }
  .sec-micro-secondary .methods-list.compact .row .n {
    font-size: 24px;
  }
  .sec-micro-secondary .methods-list.compact .row h4 {
    font-size: 20px; margin-bottom: 8px;
  }
  @media (max-width: 560px) {
    .sec-micro-secondary { padding: 64px 18px; }
  }
  .ba-slider {
    position: relative; overflow: hidden; aspect-ratio: 16/10; background: var(--bg-soft);
    user-select: none; touch-action: none; margin-top: 24px;
    cursor: ew-resize;
  }
  .ba-slider img.ba-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    user-select: none; pointer-events: none; -webkit-user-drag: none;
  }

  /* transition strip between heading and slider */
  .ba-intro {
    margin-top: 28px;
    display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end;
    padding-bottom: 18px; border-bottom: 1px solid var(--hair);
  }
  .ba-intro .ba-rule {
    height: 1px; background: var(--ink); width: 100%; transform-origin: left;
  }
  .ba-intro .ba-eyebrow {
    display: flex; align-items: baseline; gap: 22px; white-space: nowrap;
  }
  .ba-intro .small-caps { color: var(--ink); }
  .ba-intro .ba-hint {
    font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--muted);
  }
  .ba-side { position: absolute; inset: 0; }
  .ba-side.after { clip-path: inset(0 0 0 var(--pos, 50%)); }
  .ba-divider {
    position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 1px;
    background: rgba(255,255,255,0.95); box-shadow: 0 0 30px rgba(0,0,0,0.18);
  }
  .ba-handle {
    position: absolute; top: 50%; left: var(--pos, 50%); transform: translate(-50%, -50%);
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 1px solid var(--hair);
    cursor: ew-resize; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  .ba-handle::before, .ba-handle::after {
    content:""; width: 6px; height: 6px; border-top: 2px solid var(--ink); border-right: 2px solid var(--ink);
    position: absolute; top: 50%;
  }
  .ba-handle::after { right: 14px; transform: translateY(-50%) rotate(45deg); }
  .ba-handle::before { left: 14px; transform: translateY(-50%) rotate(-135deg); }
  .ba-label {
    position: absolute; top: 16px; padding: 6px 12px; background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
    font-family: var(--sans); font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); font-weight: 500;
  }
  .ba-label.left { left: 16px; } .ba-label.right { right: 16px; }

  /* methods - tighter top margin */
  .methods-wrap { display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px; margin-top: 80px; align-items: start; }
  .methods-wrap .sticky-col {
    position: sticky; top: 18vh; align-self: start;
  }
  .methods-list .row {
    padding: 56px 0; border-bottom: 1px solid var(--hair);
    display: grid; grid-template-columns: 72px 1fr; gap: 32px; align-items: start;
  }
  .methods-list .row:first-child { border-top: 1px solid var(--hair); }
  .methods-list .row .n {
    font-family: var(--serif); font-style: italic; font-size: 32px; line-height: 1; color: var(--ink);
  }
  .methods-list .row h4 {
    font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 26px; margin-bottom: 14px;
  }
  .methods-list .row p { font-size: 15px; color: var(--muted); }

  /* healing cycle — calm vertical grid */
  .healing-cycle {
    background: var(--bg-soft);
    padding: 132px 48px;
  }
  .healing-cycle .chapter { margin-bottom: 40px; }
  .cycle-grid {
    margin-top: 72px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
    align-items: stretch;
  }
  .cycle-card {
    background: #fff; border: 1px solid var(--hair);
    padding: 40px 32px 36px;
    display: flex; flex-direction: column;
  }
  .cycle-card .w {

  /* ---------- Trayectoria ---------- */
  .sec-track { background: var(--track-bg); color: var(--track-ink); padding: 130px 48px; position: relative; overflow: hidden; }
  .sec-track .small-caps, .sec-track .kicker { color: color-mix(in srgb, var(--track-ink) 65%, transparent); }
  .sec-track .h-section { color: var(--track-ink); }

  .sec-track .body { color: color-mix(in srgb, var(--track-ink) 72%, transparent); }
  .track-timeline {
    margin-top: 80px; position: relative; max-width: 1120px; margin-left: auto; margin-right: auto;
  }
  .track-timeline::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--track-ink) 18%, transparent) 8%, color-mix(in srgb, var(--track-ink) 18%, transparent) 92%, transparent);
  }
  .track-progress {
    content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 0%;

  }
  .track-step {
    display: grid; grid-template-columns: 1fr 60px 1fr; gap: 56px; align-items: center;
    margin-bottom: 110px; position: relative;
  }
  .track-step:last-child { margin-bottom: 0; }
  .track-step .img-wrap { aspect-ratio: 4/5; overflow: hidden; background: color-mix(in srgb, var(--track-ink) 10%, transparent); position: relative; }
  .track-step .img-wrap .inner { position: absolute; inset: -8% 0; }
  .track-step .img-wrap .cover-img { transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  .track-step .img-wrap:hover .cover-img { transform: scale(1.07); }
  .track-step .text { padding: 20px 0; }
  .track-step .text .n { font-family: var(--serif); font-style: italic; font-size: 120px; line-height: 1; color: color-mix(in srgb, var(--track-ink) 14%, transparent); margin-bottom: 24px; }
  .track-step .text h3 { font-family: var(--serif); font-style: italic; font-size: 36px; font-weight: 400; margin-bottom: 20px; max-width: 24ch; color: var(--track-ink); }
  .track-step .text p { font-size: 15.5px; color: color-mix(in srgb, var(--track-ink) 72%, transparent); line-height: 1.75; max-width: 42ch; }
  .track-step .dot {
    width: 14px; height: 14px; border-radius: 50%; background: var(--track-ink);
    justify-self: center; box-shadow: 0 0 0 6px color-mix(in srgb, var(--track-ink) 8%, transparent);
    transition: box-shadow .8s ease, background .8s ease, transform .8s ease;

  .track-step.in .dot { box-shadow: 0 0 0 12px color-mix(in srgb, var(--track-ink) 15%, transparent); transform: scale(1.2); }
  .track-step.right .img-wrap { grid-column: 3; }
  .track-step.right .text { grid-column: 1; text-align: right; }
  .track-step.right .text p { margin-left: auto; }
